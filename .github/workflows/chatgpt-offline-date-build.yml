name: ChatGPT Offline Date Build Check

on:
  push:
    branches: ["chatgpt/offline-date-free-chat"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
