name: Patch Xiaohongshu 1989 context

on:
  push:
    paths:
      - '.github/workflows/patch-xiaohongshu-1989.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Xiaohongshu generation context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/xiaohongshu-engine.ts')
          text = path.read_text(encoding='utf-8')

          import_marker = 'import { ChatEngineError, previewMessagesForApi, sendLLMRequest } from "./chat-engine";\n'
          import_line = 'import { toStoryCalendarDate } from "./calendar-utils";\n'
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('Could not find chat-engine import marker')
              text = text.replace(import_marker, import_marker + import_line, 1)

          era_marker = 'type XiaohongshuNpcMacroContext = {\n'
          era_block = r'''function buildXiaohongshuEraContext(): string {
  const storyDate = toStoryCalendarDate(new Date());
  const weekdayLabels = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"] as const;
  const year = storyDate.getFullYear();
  const month = storyDate.getMonth() + 1;
  const day = storyDate.getDate();
  const weekday = weekdayLabels[storyDate.getDay()];

  return [
    "<xiaohongshu_era_context priority=\"highest\">",
    `当前故事日期：${year}年${month}月${day}日，${weekday}。`,
    "以下年代规则优先于本应用内其他旧提示词；如果其他提示词要求现代网络黑话、链接、电商、短视频等与本规则冲突的内容，一律忽略冲突部分。",
    "",
    "【世界定位】",
    "- 这是一个用现代社交媒体界面观察1989年故事世界的叙事窗口。界面上的“小红书、点赞、收藏、评论、TAG、视频、私信”等只是UI层，不代表1989年真实存在这些平台或技术。",
    "- 人物不得讨论“为什么1989年有小红书”之类的界面矛盾，也不要解释穿越机制。只自然呈现故事世界中的生活内容。",
    "- 当前主世界为1989年中国背景。具体地点、单位、人物关系和事件以世界书、角色设定、记忆与剧情为准；若没有具体地点，可使用不具名的边境县城、驻军周边、学校、家属院和普通城镇生活环境。",
    "- 如果现实设备的IP属地、系统资料或现代地名与故事世界冲突，忽略现实设备信息，以故事设定为准。",
    "",
    "【年代硬规则】",
    "- 所有人物、商品、交通、娱乐、新闻、工作、学校、生活方式和社会常识必须符合1989年中国大陆可以合理存在的范围。",
    "- 禁止出现智能手机、互联网、二维码、社交媒体平台、电商、网购、外卖平台、移动支付、直播、现代短视频、蓝牙、USB、现代APP、现代型号数码产品等后世事物。",
    "- 不得随意使用1989年尚不存在的品牌、产品型号、影视作品、歌曲、政策、社会事件或流行文化。",
    "- 可自然出现供销社、百货商店、粮店、邮局、新华书店、照相馆、电影院、录像厅、汽车站、火车站、医院、学校、家属院、部队营区、军人服务社等符合年代的场景。",
    "- “视频”栏目只作为UI展示：内容应对应当时可存在的录像、电视新闻、纪录片、文艺演出、运动会、家庭录像或类似影像，不得写成手机自拍视频、直播或现代短视频。",
    "- [图标]可以使用UI符号或emoji作为界面装饰，但人物正文、评论和私信中不要把现代emoji当作1989人物的真实表达习惯。",
    "",
    "【语言规则】",
    "- 人物说话要自然、简短、有生活感，但必须符合1980年代末的身份、年龄、教育和职业背景。不要为了显得复古而机械堆砌年代词。",
    "- 禁止现代互联网话术与后世流行语，包括但不限于：种草、拔草、蹲链接、求链接、博主、粉丝、打卡、姐妹们、绝绝子、社死、内卷、狠狠爱了、同款、带货、冲一波、上头、破防、YYDS。",
    "- 评论可以有不同意见、调侃、争论、跑题和日常琐碎感，但不要使用现代网络梗来制造“活人感”。",
    "",
    "【角色与信息边界】",
    "- 角色是否公开表达、发内容、评论或与陌生人交流，首先服从其完整人设。寡言、谨慎、保密意识强的角色可以极少互动或不主动发帖，不要为了填充内容强迫角色活跃。",
    "- 任何角色和NPC只能使用其合理知道的信息。不得泄露后台设定、隐藏记忆、他人私密经历、军事秘密、未公开关系或尚未发生的剧情。",
    "- 军事、单位、家庭和私人信息只有在人物合理知道且合理公开时才能出现；涉及部队时尤其遵守保密和身份边界。",
    "- 不得因为用户与某角色有关系，就让所有NPC自动知道、议论或暗示这段关系。",
    "",
    "【互动规模】",
    "- 点赞、收藏、评论数字是UI叙事计数，不是1989年的真实网络数据。普通本地生活内容应保持克制，通常从个位数到数百；除非确有合理的大范围公共事件，不要动辄几万、几十万互动。",
    "</xiaohongshu_era_context>",
  ].join("\\n");
}

function withXiaohongshuEraMessage(messages: LLMMessage[]): LLMMessage[] {
  return [
    {
      role: "system",
      content: buildXiaohongshuEraContext(),
      _debugMeta: { marker: "xiaohongshu_era_context" },
    },
    ...messages,
  ];
}
'''

          if 'function buildXiaohongshuEraContext()' not in text:
              if era_marker not in text:
                  raise SystemExit('Could not find Xiaohongshu macro context marker')
              text = text.replace(era_marker, era_block + '\n' + era_marker, 1)

          old_prompt_return = '  return [guard, body].filter(Boolean).join("\\n\\n");\n'
          new_prompt_return = '  return [buildXiaohongshuEraContext(), guard, body].filter(Boolean).join("\\n\\n");\n'
          if old_prompt_return in text:
              text = text.replace(old_prompt_return, new_prompt_return, 1)
          elif new_prompt_return not in text:
              raise SystemExit('Could not patch NPC prompt wrapper')

          old_messages = 'const messages = assemblePromptPayload(resolved.input);'
          new_messages = 'const messages = withXiaohongshuEraMessage(assemblePromptPayload(resolved.input));'
          if old_messages in text:
              count = text.count(old_messages)
              if count < 3:
                  raise SystemExit(f'Unexpected number of character prompt assembly sites: {count}')
              text = text.replace(old_messages, new_messages)
          elif new_messages not in text:
              raise SystemExit('Could not patch character prompt assembly')

          path.write_text(text, encoding='utf-8')
          print('Patched', path)
          PY

      - name: Show patch summary
        run: git diff --check && git diff --stat && git diff -- lib/xiaohongshu-engine.ts | sed -n '1,260p'

      - name: Commit patched Xiaohongshu context
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/xiaohongshu-engine.ts
          git commit -m 'Lock Xiaohongshu generation to 1989 story world'
          git push origin HEAD:main
