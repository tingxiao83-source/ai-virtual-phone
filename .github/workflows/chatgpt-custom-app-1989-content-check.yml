name: ChatGPT Custom App 1989 Content Check

on:
  push:
    branches:
      - chatgpt/custom-app-1989-content

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
