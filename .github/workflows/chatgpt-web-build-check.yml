name: ChatGPT Web Build Check

on:
  push:
    branches:
      - chatgpt/1989-offline-world
    paths-ignore:
      - "android-shell/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
